<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>with Watari</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
 background: #111;
  color: #aaa;
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  font-weight: 400;
  letter-spacing: 0.05em;
      display: flex;
      justify-content: center;
      align-items: center;
    }
.conversation-menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.conversation-menu button {
  min-height: 48px;
  padding: 10px 8px;
  font-size: 14px;
  background: transparent;
  color: #eee;
  border: 1px solid #555;
  cursor: pointer;
}

.conversation-menu button:last-child {
  grid-column: 1 / -1;
}
.terminal {
  width: min(92vw, 700px);
  min-height: 80vh;
  padding: 20px;
  border: 1px solid #555;
  background: #181818;
  text-align: center;
}

.title {
  font-size: 12px;
  letter-spacing: 3px;
  color: #888;
  margin-bottom: 15px;
}

.watari {
  width: 220px;
  height: 160px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #444;
}

.watari img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  object-position: center 10%;
}

    .watari-placeholder {
      font-size: 14px;
    }

    .message {
      min-height: 80px;
      padding: 20px;
      line-height: 1.8;
      font-size: 16px;
    }

.talk-button {
  margin-top: 15px;
  padding: 14px 40px;
  min-height: 48px;
  background: transparent;
  color: #eee;
  border: 1px solid #777;
  cursor: pointer;
  font-size: 15px;
}

    .talk-button:hover {
      background: #333;
    }

.clock-label {
  margin-top: 25px;
  color: #555;
  font-size: 10px;
  letter-spacing: 2px;
}

.clock {
  margin-top: 5px;
  color: #aaa;
  font-size: 18px;
  letter-spacing: 2px;
}
.mode-area {
  margin-top: 20px;
}

.mode-label {
  margin-bottom: 8px;
  color: #888;
  font-size: 10px;
  letter-spacing: 2px;
}

.mode-select {
  padding: 8px 14px;
  background: #111;
  color: #aaa;
  border: 1px solid #555;
  font-size: 12px;
  cursor: pointer;
}
    #clock {
  letter-spacing: 0.12em;
  font-weight: 300;
}
    .weather-panel {
  margin: 18px auto 0;
  padding: 14px 18px;
  width: min(88vw, 420px);
  border: 1px solid #444;
  background: #202020;
  text-align: left;
}

.weather-title {
  margin-bottom: 10px;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: #777;
  text-align: center;
}

#weather {
  font-size: 12px;
  line-height: 1.9;
  letter-spacing: 0.04em;
  color: #bbb;
}
  </style>
</head>

<body>

  <main class="terminal">

    <div class="title">
      PRIVATE COMPANION TERMINAL
    </div>

<div class="watari">
  <img src="watari.png" alt="ワタリ">
</div>

<div id="message" class="message"></div>

<div class="mode-area">
  <div class="mode-label">
    MODE
  </div>

  <select id="modeSelect" class="mode-select">
    <option value="normal">通常</option>
    <option value="sleep">おやすみ</option>
    <option value="return">帰宅</option>
    <option value="meal">食事</option>
    <option value="outing">外出</option>
  </select>
  <button id="conversationButton">話しかける</button>
  <div id="conversationMenu" class="conversation-menu">
<button id="teaButton">☕ ティータイム</button>
<button id="whatButton">💬 いま何してた？</button>
  <button>👀 Lの様子</button>
  <button>🎩 ワタリの話</button>
  <button>👏 ほめる</button>
  <button>🎲 あそぶ</button>
  <button>⌨️ 集中する</button>
</div>
</div>

<button id="talkButton" class="talk-button">
  TALK
</button>
<button id="weatherButton">WEATHER</button>
<div class="weather-panel">
  <div class="weather-title">WEATHER REPORT</div>
  <div id="weather"></div>
</div>
    
    <div class="clock-label">CURRENT TIME</div>
<div id="clock" class="clock"></div>

  </main>

  <script>
    const message = document.getElementById("message");
    const talkButton = document.getElementById("talkButton");
    const clock = document.getElementById("clock");
const weatherButton = document.getElementById("weatherButton");
const weather = document.getElementById("weather");
const modeSelect = document.getElementById("modeSelect");
const conversationButton = document.getElementById("conversationButton");
const conversationMenu = document.getElementById("conversationMenu");

const teaButton = document.getElementById("teaButton");

teaButton.addEventListener("click", () => {
  const messages = conversationTalk.tea;
  const index = Math.floor(Math.random() * messages.length);

  message.textContent = messages[index];
});

    const whatButton = document.getElementById("whatButton");

whatButton.addEventListener("click", () => {
  const messages = conversationTalk.what;
  const index = Math.floor(Math.random() * messages.length);

  message.textContent = messages[index];
});

    
    
conversationButton.addEventListener("click", () => {
  if (conversationMenu.style.display === "grid") {
    conversationMenu.style.display = "none";
  } else {
    conversationMenu.style.display = "grid";
  }
});
let currentMode = "normal";

modeSelect.addEventListener("change", () => {
  currentMode = modeSelect.value;
});
    
    function getTimePeriod() {
  const hour = new Date().getHours();

  if (hour >= 5 && hour < 11) return "morning";
  if (hour >= 11 && hour < 17) return "daytime";
  if (hour >= 17 && hour < 23) return "evening";
  return "lateNight";
}

function getGreeting() {
  const period = getTimePeriod();

  if (period === "morning") {
    return "おはようございます。";
  }

  if (period === "daytime") {
    return "こんにちは。";
  }

  if (period === "evening") {
    return "お疲れさまでした。";
  }

  return "まだお休みではなかったのですね。";
}

const generalTalk = {
  morning: [
    "おはようございます。朝食はお済みですか。"
  ],

  daytime: [
    "こんにちは。今日はどのようにお過ごしですか。"
  ],

  evening: [
    "本日もお疲れさまでした。",
    "そろそろお休みになる準備をなさってはいかがですか。"
  ],

  lateNight: [
    "もう遅い時間です。そろそろお休みください。",
     "まだ起きていらっしゃるのですか。",
    "明日に差し支えますよ。",
    "……眠れないのでしたら、お話くらいはお付き合いいたします。",
    "夜更かしはほどほどになさってくださいね。"
  ],

  neutral: [
    "何かお手伝いできることがあれば、お申し付けください。",
    "どうぞご無理はなさらないでくださいね。"
  ],
  
  sleep: [
  "そろそろお休みになる時間です。",
  "明日に備えて、どうぞゆっくりお休みください。",
  "お休みになる前に、何かご用意するものはございますか。"
],
  return: [
  "お帰りなさいませ。",
  "お待ちしておりました。",
  "お疲れのところ、お帰りいただきありがとうございます。",
  "お食事の準備はいかがいたしましょうか。"
]
};

const conversationTalk = {
  tea: [
    "お茶をお淹れしましょうか。",
    "本日はどのお茶になさいますか。",
    "少し休憩なさってはいかがですか。"
  ],

  what: [
    "お戻りになるまで、こちらで待機しておりました。",
    "特に変わったことはございません。いつも通りでございます。",
    "L様の様子を確認しておりました。"
  ]
};
    
const talkHistory = {
  normal: [],
  sleep: [],
  return: []
};

let lastTalkMessage = "";
    
function getRandomTalkMessage() {
  let messages;
  let historyKey;

if (currentMode === "sleep") {
  messages = generalTalk.sleep;
  historyKey = "sleep";

} else if (currentMode === "return") {
  messages = generalTalk.return;
  historyKey = "return";
  } else {
    const period = getTimePeriod();

    messages = Math.random() < 0.6
      ? generalTalk[period]
      : generalTalk.neutral;

    historyKey = "normal";
  }

  if (!Array.isArray(messages) || messages.length === 0) {
    return "";
  }

  let history = talkHistory[historyKey];

  if (history.length >= messages.length) {
    talkHistory[historyKey] = [];
    history = talkHistory[historyKey];
  }

  let available = messages.filter(
    (message) => !history.includes(message)
  );

  // 直前と同じセリフも除外
  available = available.filter(
    (message) => message !== lastTalkMessage
  );

  // 候補がなくなった場合は、履歴だけリセットして再抽選
  if (available.length === 0) {
    talkHistory[historyKey] = [];
    history = talkHistory[historyKey];

    available = messages.filter(
      (message) => message !== lastTalkMessage
    );
  }

  const index = Math.floor(Math.random() * available.length);
  const selected = available[index];

  history.push(selected);
  lastTalkMessage = selected;

  return selected;
}



    function updateClock() {
      const now = new Date();

const time = now.toLocaleTimeString("ja-JP", {
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit"
});

      clock.textContent = time;
    }

talkButton.addEventListener("click", () => {
  message.textContent = getRandomTalkMessage();
});

    updateClock();
    setInterval(updateClock, 1000);
    message.textContent = getGreeting();
      // 天気情報を取得
async function getWeather() {
  weather.textContent = "天気を確認しています。";

  try {
    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo"
    );

    const data = await response.json();

const now = new Date();


    const hourlyTime = data.hourly.time;
    const hourlyTemperature = data.hourly.temperature_2m;
    const hourlyWeather = data.hourly.weather_code;
    const hourlyRain = data.hourly.precipitation_probability;

// 現在時刻以降で、一番近い予報データを探す
let currentIndex = hourlyTime.findIndex((time) => {
  const forecastTime = new Date(time);
  return forecastTime >= now;
});

    if (currentIndex === -1) {
      currentIndex = 0;
    }

    const currentTemperature = hourlyTemperature[currentIndex];
    const currentWeather = getWeatherText(hourlyWeather[currentIndex]);
    const currentRain = hourlyRain[currentIndex];

    // 今後6時間の中で雨の可能性が高い時間を探す
    let rainMessage = "";

    for (
      let i = currentIndex;
      i < Math.min(currentIndex + 6, hourlyTime.length);
      i++
    ) {
      if (hourlyRain[i] >= 50) {
        const rainHour = new Date(hourlyTime[i]).getHours();

        rainMessage =
          `${rainHour}時頃から雨の可能性があるようです。`;
        break;
      }
    }

    if (!rainMessage) {
      rainMessage = "しばらく雨の心配はなさそうです。";
    }

const currentIcon = getWeatherIcon(hourlyWeather[currentIndex]);

weather.textContent =
  `${currentIcon} 現在は${currentWeather}、気温は${currentTemperature}℃です。` +
  `降水確率は${currentRain}%です。` +
  rainMessage;

  } catch (error) {
    weather.textContent =
      "申し訳ありません。天気を取得できませんでした。";

    console.error(error);
  }
}

function getWeatherText(code) {
  if (code === 0) return "晴れ";
  if ([1, 2, 3].includes(code)) return "晴れまたは曇り";
  if ([45, 48].includes(code)) return "霧";
  if ([51, 53, 55, 56, 57].includes(code)) return "霧雨";
  if ([61, 63, 65, 66, 67].includes(code)) return "雨";
  if ([71, 73, 75, 77].includes(code)) return "雪";
  if ([80, 81, 82].includes(code)) return "にわか雨";
  if ([85, 86].includes(code)) return "にわか雪";
  if ([95, 96, 99].includes(code)) return "雷雨";

  return "不明な天気";
}

weatherButton.addEventListener("click", () => {
  getWeather();
});
    function getWeatherIcon(code) {
  if (code === 0) return "☀️";
  if ([1, 2, 3].includes(code)) return "☁️";
  if ([45, 48].includes(code)) return "🌫️";
  if ([51, 53, 55, 56, 57].includes(code)) return "🌧️";
  if ([61, 63, 65, 66, 67].includes(code)) return "☔";
  if ([71, 73, 75, 77].includes(code)) return "❄️";
  if ([80, 81, 82].includes(code)) return "🌦️";
  if ([85, 86].includes(code)) return "🌨️";
  if ([95, 96, 99].includes(code)) return "⛈️";

  return "🌤️";
}
  </script>

</body>
</html>
