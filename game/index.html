<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワタリのお手伝い</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <div class="wall"></div>
  <div class="floor"></div>

  <img src="images/table.png" class="table">

  <img src="images/chair.png" class="chair chair-left">
  <img src="images/chair.png" class="chair chair-right">

  <img src="images/watari.png" class="character watari">
  <img src="images/l.png" class="character l">

  <img id="cup" class="cup" src="images/cup.png">

</div>

<div id="message">
  ワタリ「Lにコーヒーをお願いいたします。」
</div>

<div id="drink-buttons">
<button data-drink="green_tea">緑茶</button>
<button data-drink="coffee">コーヒー</button>
<button data-drink="black_tea">紅茶</button>
</div>

<script src="game.js"></script>

</body>
</html>
