<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワタリのお手伝い</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <div class="wall"></div>
  <div class="floor"></div>

  <img src="images/table.png" class="table">

  <img src="images/chair.png" class="chair chair-left">
  <img src="images/chair.png" class="chair chair-right">

  <img src="images/watari.png" class="character watari">
  <img src="images/l.png" class="character l">

  <img id="cup" class="cup" src="images/cup.png">

</div>


<div id="message">
  ワタリ「Lにコーヒーをお願いいたします。」
</div>


<div id="drink-buttons">

  <button
    onmousedown="startPouring('green_tea')"
    onmouseup="stopPouring()"
    onmouseleave="stopPouring()"
    ontouchstart="startPouring('green_tea')"
    ontouchend="stopPouring()"
  >
    緑茶
  </button>

  <button
    onmousedown="startPouring('coffee')"
    onmouseup="stopPouring()"
    onmouseleave="stopPouring()"
    ontouchstart="startPouring('coffee')"
    ontouchend="stopPouring()"
  >
    コーヒー
  </button>

  <button
    onmousedown="startPouring('black_tea')"
    onmouseup="stopPouring()"
    onmouseleave="stopPouring()"
    ontouchstart="startPouring('black_tea')"
    ontouchend="stopPouring()"
  >
    紅茶
  </button>

</div>


<!-- 注ぐ量のバー -->

<div id="pour-bar">
  <div id="pour-progress"></div>
</div>


<script src="game.js"></script>

</body>
</html>
