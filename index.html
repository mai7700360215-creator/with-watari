<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>with Watari</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
 background: #111;
  color: #aaa;
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  font-weight: 400;
  letter-spacing: 0.05em;
      display: flex;
      justify-content: center;
      align-items: center;
    }

.terminal {
  width: min(92vw, 700px);
  min-height: 80vh;
  padding: 20px;
  border: 1px solid #555;
  background: #181818;
  text-align: center;
}

.title {
  font-size: 12px;
  letter-spacing: 3px;
  color: #888;
  margin-bottom: 15px;
}

.watari {
  width: 220px;
  height: 300px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #444;
}

.watari img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

    .watari-placeholder {
      font-size: 14px;
    }

    .message {
      min-height: 80px;
      padding: 20px;
      line-height: 1.8;
      font-size: 16px;
    }

    .talk-button {
      margin-top: 15px;
      padding: 12px 35px;
      background: transparent;
      color: #eee;
      border: 1px solid #777;
      cursor: pointer;
      font-size: 14px;
    }

    .talk-button:hover {
      background: #333;
    }

.clock-label {
  margin-top: 25px;
  color: #555;
  font-size: 10px;
  letter-spacing: 2px;
}

.clock {
  margin-top: 5px;
  color: #aaa;
  font-size: 18px;
  letter-spacing: 2px;
}
.mode-area {
  margin-top: 20px;
}

.mode-label {
  margin-bottom: 8px;
  color: #888;
  font-size: 10px;
  letter-spacing: 2px;
}

.mode-select {
  padding: 8px 14px;
  background: #111;
  color: #aaa;
  border: 1px solid #555;
  font-size: 12px;
  cursor: pointer;
}
    #clock {
  letter-spacing: 0.12em;
  font-weight: 300;
}
  </style>
</head>

<body>

  <main class="terminal">

    <div class="title">
      PRIVATE COMPANION TERMINAL
    </div>

<div class="watari">
  <img src="watari.png" alt="ワタリ">
</div>

<div id="message" class="message"></div>

<div class="mode-area">
  <div class="mode-label">
    MODE
  </div>

  <select id="modeSelect" class="mode-select">
    <option value="normal">通常</option>
    <option value="sleep">おやすみ</option>
    <option value="return">帰宅</option>
    <option value="meal">食事</option>
    <option value="outing">外出</option>
  </select>
</div>

<button id="talkButton" class="talk-button">
  TALK
</button>
<button id="weatherButton">WEATHER</button>
<div id="weather"></div>
    
    <div class="clock-label">CURRENT TIME</div>
<div id="clock" class="clock"></div>

  </main>

  <script>
    const message = document.getElementById("message");
    const talkButton = document.getElementById("talkButton");
    const clock = document.getElementById("clock");
const weatherButton = document.getElementById("weatherButton");
const weather = document.getElementById("weather");
const modeSelect = document.getElementById("modeSelect");

let currentMode = "normal";

modeSelect.addEventListener("change", () => {
  currentMode = modeSelect.value;
});
    
    function getTimePeriod() {
  const hour = new Date().getHours();

  if (hour >= 5 && hour < 11) return "morning";
  if (hour >= 11 && hour < 17) return "daytime";
  if (hour >= 17 && hour < 23) return "evening";
  return "lateNight";
}

function getGreeting() {
  const period = getTimePeriod();

  if (period === "morning") {
    return "おはようございます。";
  }

  if (period === "daytime") {
    return "こんにちは。";
  }

  if (period === "evening") {
    return "お疲れさまでした。";
  }

  return "まだお休みではなかったのですね。";
}

const generalTalk = {
  morning: [
    "おはようございます。朝食はお済みですか。"
  ],

  daytime: [
    "こんにちは。今日はどのようにお過ごしですか。"
  ],

  evening: [
    "本日もお疲れさまでした。",
    "そろそろお休みになる準備をなさってはいかがですか。"
  ],

  lateNight: [
    "もう遅い時間です。そろそろお休みください。",
     "まだ起きていらっしゃるのですか。",
    "明日に差し支えますよ。",
    "……眠れないのでしたら、お話くらいはお付き合いいたします。",
    "夜更かしはほどほどになさってくださいね。"
  ],

  neutral: [
    "何かお手伝いできることがあれば、お申し付けください。",
    "どうぞご無理はなさらないでくださいね。"
  ],
  
  sleep: [
  "そろそろお休みになる時間です。",
  "明日に備えて、どうぞゆっくりお休みください。",
  "お休みになる前に、何かご用意するものはございますか。"
],
  return: [
  "お帰りなさいませ。",
  "お待ちしておりました。",
  "お疲れのところ、お帰りいただきありがとうございます。",
  "お食事の準備はいかがいたしましょうか。"
]
};
const talkHistory = {
  normal: [],
  sleep: [],
  return: []
};

let lastTalkMessage = "";
    
function getRandomTalkMessage() {
  let messages;
  let historyKey;

if (currentMode === "sleep") {
  messages = generalTalk.sleep;
  historyKey = "sleep";

} else if (currentMode === "return") {
  messages = generalTalk.return;
  historyKey = "return";
  } else {
    const period = getTimePeriod();

    messages = Math.random() < 0.6
      ? generalTalk[period]
      : generalTalk.neutral;

    historyKey = "normal";
  }

  if (!Array.isArray(messages) || messages.length === 0) {
    return "";
  }

  let history = talkHistory[historyKey];

  if (history.length >= messages.length) {
    talkHistory[historyKey] = [];
    history = talkHistory[historyKey];
  }

  let available = messages.filter(
    (message) => !history.includes(message)
  );

  // 直前と同じセリフも除外
  available = available.filter(
    (message) => message !== lastTalkMessage
  );

  // 候補がなくなった場合は、履歴だけリセットして再抽選
  if (available.length === 0) {
    talkHistory[historyKey] = [];
    history = talkHistory[historyKey];

    available = messages.filter(
      (message) => message !== lastTalkMessage
    );
  }

  const index = Math.floor(Math.random() * available.length);
  const selected = available[index];

  history.push(selected);
  lastTalkMessage = selected;

  return selected;
}



    function updateClock() {
      const now = new Date();

const time = now.toLocaleTimeString("ja-JP", {
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit"
});

      clock.textContent = time;
    }

talkButton.addEventListener("click", () => {
  message.textContent = getRandomTalkMessage();
});

    updateClock();
    setInterval(updateClock, 1000);
    message.textContent = getGreeting();
      // 天気情報を取得
    async function getWeather() {
  weather.textContent = "天気を確認しています。";

  try {
    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo"
    );

    const data = await response.json();

    const temperature = data.current.temperature_2m;
    const code = data.current.weather_code;

    const weatherText = getWeatherText(code);

    weather.textContent =
      `本日の東京は${weatherText}です。現在の気温は${temperature}℃です。`;

  } catch (error) {
    weather.textContent =
      "申し訳ありません。天気を取得できませんでした。";
    console.error(error);
  }
}

function getWeatherText(code) {
  if (code === 0) return "晴れ";
  if ([1, 2, 3].includes(code)) return "晴れまたは曇り";
  if ([45, 48].includes(code)) return "霧";
  if ([51, 53, 55, 56, 57].includes(code)) return "霧雨";
  if ([61, 63, 65, 66, 67].includes(code)) return "雨";
  if ([71, 73, 75, 77].includes(code)) return "雪";
  if ([80, 81, 82].includes(code)) return "にわか雨";
  if ([85, 86].includes(code)) return "にわか雪";
  if ([95, 96, 99].includes(code)) return "雷雨";

  return "不明な天気";
}

weatherButton.addEventListener("click", () => {
  getWeather();
});
  </script>

</body>
</html>
