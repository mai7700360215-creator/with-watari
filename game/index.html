```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワタリのお手伝い</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- =========================
       ゲーム画面
  ========================== -->

  <!-- 壁 -->
  <div class="wall"></div>

  <!-- 床 -->
  <div class="floor"></div>


  <!-- =========================
       家具
       今は全部 te-buru.png で仮置き
  ========================== -->

  <!-- 長方形テーブル1：4-1 -->
  <img src="images/te-buru.png"
       class="table table-1">

  <!-- 長方形テーブル2：11-2 -->
  <img src="images/te-buru.png"
       class="table table-2">

  <!-- 正方形テーブル3：6-6 -->
  <img src="images/te-buru.png"
       class="table table-3">

  <!-- PCデスク：11-10 -->
  <img src="images/te-buru.png"
       class="table table-4">


  <!-- =========================
       椅子
       今は同じ isu.png で仮置き
  ========================== -->

  <!-- ワタリ用 -->
  <img src="images/isu.png"
       class="chair chair-watari">

  <!-- L用 -->
  <img src="images/isu.png"
       class="chair chair-l">

  <!-- 松田用 -->
  <img src="images/isu.png"
       class="chair chair-matsuda">

  <!-- 模木用 -->
  <img src="images/isu.png"
       class="chair chair-mogi">


  <!-- =========================
       キャラクター
  ========================== -->

  <!-- ワタリ：8-2 -->
  <img src="images/ミニキャラピクセルワタリ.png"
       class="character watari">


  <!-- L：10-10 -->
  <img src="images/ミニキャラピクセルL.png"
       class="character l">


  <!-- 松田：4-6
       現在はLの画像を仮使用 -->
  <img src="images/ミニキャラピクセルL.png"
       class="character matsuda">


  <!-- 模木：6-8
       現在はLの画像を仮使用 -->
  <img src="images/ミニキャラピクセルL.png"
       class="character mogi">


  <!-- =========================
       カップ
  ========================== -->

  <img id="cup"
       class="cup"
       src="images/cup.png">


  <!-- =========================
       ワタリのメッセージ
  ========================== -->

  <div id="message">
    ワタリ「Lにコーヒーをお願いいたします。」
  </div>


  <!-- =========================
       注ぐ量バー
  ========================== -->

  <div id="pour-bar">

    <!-- 3秒地点 -->
    <div id="just-line"></div>

    <!-- 注いだ量 -->
    <div id="pour-progress"></div>

  </div>


  <!-- =========================
       判定結果
  ========================== -->

  <div id="result"></div>


  <!-- =========================
       ガラケー操作エリア
  ========================== -->

  <div id="menu-area">

    <!-- 注文一覧：14-2 -->
    <button class="menu-button menu-order">
      □
    </button>

    <!-- 料理選択：17-2 -->
    <button class="menu-button menu-food">
      □
    </button>

    <!-- ワタリの助言：14-11 -->
    <button class="menu-button menu-advice">
      □
    </button>

    <!-- 会話へ戻る：17-11 -->
    <button class="menu-button menu-talk">
      □
    </button>


    <!-- =========================
         十字キー
    ========================== -->

    <div id="direction-pad">

      <!-- ↑：13.5-6.5 -->
      <button class="direction-button direction-up">
        ▲
      </button>

      <!-- ←：15.5-4.5 -->
      <button class="direction-button direction-left">
        ◀
      </button>

      <!-- ○：15.5-6.5 -->
      <button class="direction-center">
        ●
      </button>

      <!-- →：15.5-8.5 -->
      <button class="direction-button direction-right">
        ▶
      </button>

      <!-- ↓：17.5-6.5 -->
      <button class="direction-button direction-down">
        ▼
      </button>

    </div>

  </div>

</div>


<!-- =========================
     現在の飲み物ボタン
     機能を壊さないため残す
 ========================== -->

<div id="drink-buttons">

  <button data-drink="green_tea">
    緑茶
  </button>

  <button data-drink="coffee">
    コーヒー
  </button>

  <button data-drink="black_tea">
    紅茶
  </button>

</div>


<script src="game.js"></script>

</body>
</html>
```
