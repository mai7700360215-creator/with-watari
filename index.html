<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>with Watari</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .terminal {
      width: min(92vw, 700px);
      min-height: 80vh;
      padding: 30px;
      border: 1px solid #555;
      background: #181818;
      text-align: center;
    }

    .title {
      font-size: 12px;
      letter-spacing: 3px;
      color: #888;
      margin-bottom: 30px;
    }

.watari {
  width: 220px;
  height: 300px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #444;
}

.watari img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

    .watari-placeholder {
      font-size: 14px;
    }

    .message {
      min-height: 80px;
      padding: 20px;
      line-height: 1.8;
      font-size: 16px;
    }

    .talk-button {
      margin-top: 15px;
      padding: 12px 35px;
      background: transparent;
      color: #eee;
      border: 1px solid #777;
      cursor: pointer;
      font-size: 14px;
    }

    .talk-button:hover {
      background: #333;
    }

.clock-label {
  margin-top: 25px;
  color: #555;
  font-size: 10px;
  letter-spacing: 2px;
}

.clock {
  margin-top: 5px;
  color: #aaa;
  font-size: 18px;
  letter-spacing: 2px;
}
    .mode-area {
  margin-top: 20px;
}

.mode-label {
  margin-bottom: 8px;
  color: #888;
  font-size: 12px;
}

.mode-button {
  padding: 8px 18px;
  background: transparent;
  color: #aaa;
  border: 1px solid #555;
  cursor: pointer;
  font-size: 12px;
}

.mode-button:hover {
  background: #292929;
}
  </style>
</head>

<body>

  <main class="terminal">

    <div class="title">
      PRIVATE COMPANION TERMINAL
    </div>

<div class="watari">
  <img src="watari.png" alt="ワタリ">
</div>

<div id="message" class="message"></div>

<div class="mode-area">
  <div id="modeLabel" class="mode-label">
    通常モード
  </div>

  <button id="modeButton" class="mode-button">
    おやすみモードにする
  </button>
</div>

<button id="talkButton" class="talk-button">
  TALK
</button>

    <div class="clock-label">CURRENT TIME</div>
<div id="clock" class="clock"></div>

  </main>

  <script>
    const message = document.getElementById("message");
    const talkButton = document.getElementById("talkButton");
    const clock = document.getElementById("clock");

    const modeButton = document.getElementById("modeButton");
const modeLabel = document.getElementById("modeLabel");

let currentMode = "normal";

    modeButton.addEventListener("click", () => {
  if (currentMode === "normal") {
    currentMode = "sleep";
    modeLabel.textContent = "🌙 おやすみモード";
    modeButton.textContent = "通常モードにする";
  } else {
    currentMode = "normal";
    modeLabel.textContent = "通常モード";
    modeButton.textContent = "おやすみモードにする";
  }
});
    
    function getTimePeriod() {
  const hour = new Date().getHours();

  if (hour >= 5 && hour < 11) return "morning";
  if (hour >= 11 && hour < 17) return "daytime";
  if (hour >= 17 && hour < 23) return "evening";
  return "lateNight";
}

function getGreeting() {
  const period = getTimePeriod();

  if (period === "morning") {
    return "おはようございます。";
  }

  if (period === "daytime") {
    return "こんにちは。";
  }

  if (period === "evening") {
    return "お疲れさまでした。";
  }

  return "まだお休みではなかったのですね。";
}

const generalTalk = {
  morning: [
    "おはようございます。朝食はお済みですか。"
  ],

  daytime: [
    "こんにちは。今日はどのようにお過ごしですか。"
  ],

  evening: [
    "本日もお疲れさまでした。",
    "そろそろお休みになる準備をなさってはいかがですか。"
  ],

  lateNight: [
    "もう遅い時間です。そろそろお休みください。",
    "夜更かしはほどほどになさってくださいね。"
  ],

  neutral: [
    "何かお手伝いできることがあれば、お申し付けください。",
    "どうぞご無理はなさらないでくださいね。"
  ],
  
  sleep: [
  "そろそろお休みになる時間です。",
  "明日に備えて、どうぞゆっくりお休みください。",
  "お休みになる前に、何かご用意するものはございますか。"
]
};
    
    
function getRandomTalkMessage() {
  if (currentMode === "sleep") {
    const messages = generalTalk.sleep;
    const index = Math.floor(Math.random() * messages.length);

    return messages[index];
  }

  const period = getTimePeriod();

  const messages = Math.random() < 0.6
    ? generalTalk[period]
    : generalTalk.neutral;

  const index = Math.floor(Math.random() * messages.length);

  return messages[index];
}



    function updateClock() {
      const now = new Date();

const time = now.toLocaleTimeString("ja-JP", {
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit"
});

      clock.textContent = time;
    }

talkButton.addEventListener("click", () => {
  message.textContent = getRandomTalkMessage();
});

    updateClock();
    setInterval(updateClock, 1000);
    message.textContent = getGreeting();
  </script>

</body>
</html>
