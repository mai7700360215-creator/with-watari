    }

    body {

 background: #111;

.conversation-menu {

  margin-top: 12px;
  padding: 12px;
  background: #202020;
  border: 1px solid #444;
  border-radius: 4px;
}

.conversation-menu button {
  min-height: 48px;
  padding: 10px 8px;
  background: transparent;
  color: #eee;
  border: 1px solid #555;
  font-size: 14px;
  cursor: pointer;
}

.conversation-menu button:last-child {
  grid-column: 1 / -1;
}
.terminal {
  width: min(92vw, 700px);
  min-height: 80vh;
  padding: 8px 20px 20px;
  border: 1px solid #555;
  background: #181818;
  text-align: center;
}

.title {
  font-size: 12px;
  letter-spacing: 3px;
  color: #888;
  margin-bottom: 15px;
}

.watari {
  width: 220px;
  height: 160px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #444;
}

.watari img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  object-position: center 10%;
}

    .watari-placeholder {
      font-size: 14px;
    }

.message {
  position: relative;
  min-height: 80px;
  padding: 20px 24px;
  margin: 12px auto 18px;
  line-height: 1.8;
  font-size: 16px;
  background: #222;
  border: 1px solid #666;
  border-radius: 6px;
  text-align: left;
}

.message::before {
  content: "";
  position: absolute;
  top: -8px;
  left: 24px;
  width: 14px;
  height: 14px;
  background: #222;
  border-left: 1px solid #666;
  border-top: 1px solid #666;
  transform: rotate(45deg);
}

.talk-button {
  margin-top: 15px;
  padding: 14px 40px;
  min-height: 48px;
  background: transparent;
  color: #eee;
  border: 1px solid #777;
  cursor: pointer;
  font-size: 15px;
}

    .talk-button:hover {
      background: #333;
    }

.clock-label {
  margin-top: 25px;
  color: #555;
  font-size: 10px;
  letter-spacing: 2px;
}

.clock {
  margin-top: 5px;
  color: #aaa;
  font-size: 18px;
  letter-spacing: 2px;
}
.mode-area {
  margin-top: 20px;
  margin-bottom: 12px;
}

.mode-label {
  margin-bottom: 8px;
  color: #888;
  font-size: 10px;
  letter-spacing: 2px;
}

.mode-select {
  padding: 8px 14px;
  background: #111;
  color: #aaa;
  border: 1px solid #555;
  font-size: 12px;
  cursor: pointer;
}
    #clock {
  letter-spacing: 0.12em;
  font-weight: 300;
}
    .weather-panel {
  margin: 18px auto 0;
  padding: 14px 18px;
  width: min(88vw, 420px);
  border: 1px solid #444;
  background: #202020;
  text-align: left;

.weather-title {
  margin-bottom: 10px;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: #777;
  text-align: center;

#weather {
  font-size: 12px;

  letter-spacing: 0.04em;
  color: #bbb;

    .mode-menu {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;

.mode-menu button {
  min-height: 48px;
  padding: 10px 6px;
  background: transparent;
  color: #eee;
  border: 1px solid #555;
  font-size: 14px;

.mode-menu button:hover {

.sub-menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 12px;
}

.sub-menu button {
  min-height: 48px;
  padding: 10px 8px;
  background: transparent;
  color: #eee;
  border: 1px solid #555;
  font-size: 14px;
  cursor: pointer;
}
    .continue-arrow {
  display: inline-block;
  margin-left: 4px;
  animation: blinkArrow 1s infinite;
}

@keyframes blinkArrow {
  0%, 45% {
    opacity: 1;
  }

  50%, 100% {
    opacity: 0.15;
  }
}
  </style>

    function getTimePeriod() {
  const hour = new Date().getHours();

  if (hour >= 5 && hour < 11) return "morning";
  if (hour >= 11 && hour < 17) return "daytime";
  if (hour >= 17 && hour < 23) return "evening";
  return "lateNight";
}

function getGreeting() {
  const period = getTimePeriod();

  if (period === "morning") {
    return "おはようございます。";
  }

  if (period === "daytime") {
    return "こんにちは。";
  }

  if (period === "evening") {
    return "お疲れさまでした。";
  }

  return "まだお休みではなかったのですね。";
}

const talkHistory = {
  normal: [],
  sleep: [],
  return: []
};

let lastTalkMessage = "";
    
function getRandomTalkMessage() {
  let messages;
  let historyKey;

if (currentMode === "sleep") {
  messages = generalTalk.sleep;
  historyKey = "sleep";

} else if (currentMode === "return") {
  messages = generalTalk.return;
  historyKey = "return";
  } else {
    const period = getTimePeriod();

    messages = Math.random() < 0.6
      ? generalTalk[period]
      : generalTalk.neutral;

    historyKey = "normal";
  }

  if (!Array.isArray(messages) || messages.length === 0) {
    return "";
  }

  let history = talkHistory[historyKey];

  if (history.length >= messages.length) {
    talkHistory[historyKey] = [];
    history = talkHistory[historyKey];
  }

  let available = messages.filter(
    (message) => !history.includes(message)
  );

  // 直前と同じセリフも除外
  available = available.filter(
    (message) => message !== lastTalkMessage
  );

  // 候補がなくなった場合は、履歴だけリセットして再抽選
  if (available.length === 0) {
    talkHistory[historyKey] = [];
    history = talkHistory[historyKey];

    available = messages.filter(
      (message) => message !== lastTalkMessage
    );
  }

  const index = Math.floor(Math.random() * available.length);
  const selected = available[index];

  history.push(selected);
  lastTalkMessage = selected;

  return selected;
}

async function getWeather() {
  weather.textContent = "天気を確認しています。";

  try {
    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo"
    );

    const data = await response.json();

const now = new Date();


    const hourlyTime = data.hourly.time;
    const hourlyTemperature = data.hourly.temperature_2m;
    const hourlyWeather = data.hourly.weather_code;
    const hourlyRain = data.hourly.precipitation_probability;

// 現在時刻以降で、一番近い予報データを探す
let currentIndex = hourlyTime.findIndex((time) => {
  const forecastTime = new Date(time);
  return forecastTime >= now;
});

    if (currentIndex === -1) {
      currentIndex = 0;
    }

    const currentTemperature = hourlyTemperature[currentIndex];
    const currentWeather = getWeatherText(hourlyWeather[currentIndex]);
    const currentRain = hourlyRain[currentIndex];

    // 今後6時間の中で雨の可能性が高い時間を探す
    let rainMessage = "";

    for (
      let i = currentIndex;
      i < Math.min(currentIndex + 6, hourlyTime.length);
      i++
    ) {
      if (hourlyRain[i] >= 50) {
        const rainHour = new Date(hourlyTime[i]).getHours();

        rainMessage =
          `${rainHour}時頃から雨の可能性があるようです。`;
        break;
      }
    }

    if (!rainMessage) {
      rainMessage = "しばらく雨の心配はなさそうです。";
    }

const currentIcon = getWeatherIcon(hourlyWeather[currentIndex]);

weather.textContent =
  `${currentIcon} 現在は${currentWeather}、気温は${currentTemperature}℃です。` +
  `降水確率は${currentRain}%です。` +
  rainMessage;

  } catch (error) {
    weather.textContent =
      "申し訳ありません。天気を取得できませんでした。";

    console.error(error);
  }
}

function getWeatherText(code) {
  if (code === 0) return "晴れ";
  if ([1, 2, 3].includes(code)) return "晴れまたは曇り";
  if ([45, 48].includes(code)) return "霧";
  if ([51, 53, 55, 56, 57].includes(code)) return "霧雨";
  if ([61, 63, 65, 66, 67].includes(code)) return "雨";
  if ([71, 73, 75, 77].includes(code)) return "雪";
  if ([80, 81, 82].includes(code)) return "にわか雨";
  if ([85, 86].includes(code)) return "にわか雪";
  if ([95, 96, 99].includes(code)) return "雷雨";

  return "不明な天気";
}

let messageTimer = null;

let currentConversation = null;
let currentPage = 0;
let currentConversationType = null;
    
function showMessage(text, hasNextPage = false) {
  if (messageTimer) {
    clearTimeout(messageTimer);
    messageTimer = null;
  }

  message.innerHTML = "";

  const textSpan = document.createElement("span");
  message.appendChild(textSpan);

  let index = 0;

  function showNext() {
    if (index < text.length) {
      textSpan.textContent += text[index];
      index++;

      const delay = 20 + Math.random() * 25;
      messageTimer = setTimeout(showNext, delay);
      return;
    }

    messageTimer = null;

    // 長いセリフ、または次のページがある場合は▶
    if (hasNextPage || text.length >= 45) {
      const arrow = document.createElement("span");
      arrow.className = "continue-arrow";
      arrow.textContent = " ▶";
      message.appendChild(arrow);
    }
  }

  showNext();
}


function startConversation(pages) {
  currentConversation = pages;
  currentPage = 0;

  showConversationPage();
}

function showConversationPage() {
  const text = currentConversation[currentPage];

  const hasNextPage =
    currentPage < currentConversation.length - 1;

  showMessage(text, hasNextPage);
}

    const conversations = conversationTalk[conversationType];

    if (!conversations || conversations.length === 0) return;

    // 同じボタンの会話途中なら次のページへ
    if (
      currentConversation &&
      currentConversationType === conversationType
    ) {
      if (currentPage < currentConversation.length - 1) {
        currentPage++;
        showConversationPage();
      } else {
        currentConversation = null;
        currentPage = 0;
        currentConversationType = null;
      }

      return;
    }

    // 別の会話なら、現在の会話を終了して新しく開始
    currentConversation = null;
    currentPage = 0;
    currentConversationType = conversationType;

if (!conversationOrder[conversationType] ||
    conversationPosition[conversationType] >= conversationOrder[conversationType].length) {

  conversationOrder[conversationType] =
    [...Array(conversations.length).keys()];

  // 順番をシャッフル
  for (let i = conversationOrder[conversationType].length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [
      conversationOrder[conversationType][i],
      conversationOrder[conversationType][j]
    ] = [
      conversationOrder[conversationType][j],
      conversationOrder[conversationType][i]
    ];
  }

  conversationPosition[conversationType] = 0;
}

const index =
  conversationOrder[conversationType][conversationPosition[conversationType]];

conversationPosition[conversationType]++;

startConversation(conversations[index]);
